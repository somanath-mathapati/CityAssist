<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Contact | CITYASSIST</title>

  <!-- CSS -->

  <link
    rel="stylesheet"
    href="css/style.css"
  />

  <!-- GOOGLE FONT -->

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap"
    rel="stylesheet"
  />

</head>

<body>

  <!-- NAVBAR -->

  <header class="navbar">

    <div class="logo-section">

      <h2 class="logo">
        CITYASSIST
      </h2>

    </div>

    <nav class="nav-links">

      <a href="index.html" onclick="clearLocation()">Home</a>

      <a href="services.html">
        Services
      </a>

      <a href="about.html">
        About
      </a>

      <a href="contact.html">
        Contact
      </a>

    </nav>

  </header>

  <!-- CONTACT PAGE -->

  <section class="contact-page">

    <!-- TITLE -->

    <div class="contact-header">

      <h1>
        Contact Us
      </h1>

      <p>

        Have questions, feedback or
        suggestions? Reach out to us.

      </p>

    </div>

    <!-- CONTACT CONTAINER -->

    <div class="contact-container">

      <!-- LEFT -->

      <div class="contact-info">

        <h2>
          Get In Touch
        </h2>

        <p>
          📍 Kalaburgi, Karnataka
        </p>

        <p>
          📞 +91 7975753932, 9986297793, 
        </p>

        <a href="mailto:somnathsza@gmail.com">
          ✉ somnathsza@gmail.com
        </a>

        
    
       

      </div>

      <!-- RIGHT -->

      <div class="contact-form-box">

        <form class="contact-form">

          <input
            type="text"
            placeholder="Your Name"
            required
          />

          <input
            type="email"
            placeholder="Your Email"
            required
          />

          <textarea
            placeholder="Your Message"
            rows="6"
            required
          ></textarea>

          <button type="submit">
            Send Message
          </button>

        </form>

      </div>

    </div>

  </section>

</body>
</html>
