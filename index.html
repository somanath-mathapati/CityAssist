<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>CityAssist</title>

  <!-- CSS -->
  <link
    rel="stylesheet"
    href="css/style.css"
  />

  <!-- Google Font -->
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap"
    rel="stylesheet"
  />

</head>

<body>

  <!-- DASHBOARD HEADER -->

  <header class="navbar">

    <!-- LEFT SECTION -->

    <div class="logo-section">

      <h2 class="logo">
        CITYASSIST
      </h2>

    </div>

    <!-- CENTER NAVIGATION -->

    <nav class="nav-links">

     <a href="index.html" onclick="clearLocation()">
    Home
</a>

     <a href="#" onclick="checkServicesAccess()">
  Services
</a>

      <a href="about.html">
        About
      </a>

      <a href="contact.html">
        Contact
      </a>

      <a href="#">
        Favorites
      </a>

    </nav>

    <!-- RIGHT SECTION -->

    <div class="dropdown-section">

      <!-- STATE -->

      <select id="stateSelect">

        <option value="">
          Select State
        </option>

        <option value="Karnataka">
          Karnataka
        </option>

        <option value="Maharashtra">
          Maharashtra
        </option>

        <option value="Tamil Nadu">
          Tamil Nadu
        </option>

        <option value="Telangana">
          Telengana
        </option>
        <option value="Kerala">
  Kerala
</option>

<option value="Andhra Pradesh">
  Andhra Pradesh
</option>
        

      </select>

      <!-- CITY -->

      <select id="citySelect">

        <option value="">
          Select City
        </option>

      </select>

    </div>

  </header>

  <!-- HERO SECTION -->

  <section class="hero">

    <div class="overlay">

      <h1>
        CITYASSIST
      </h1>

      <p>
        Discover nearby hospitals,
        restaurants, cafes, salons,
        garages and smart city services
        in one place.
      </p>

      <button onclick="goToServices()">
        Explore Services
      </button>

    </div>

  </section>

  <!-- JS -->

  <script src="js/app.js"></script>
<script src="js/placesData.js"></script>
<script src="js/app.js"></script>
</body>
</html>
